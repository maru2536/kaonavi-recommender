<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カオナビ 採用記事レコメンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <!-- Password Authentication Screen -->
  <div id="auth-screen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
  ">
    <div style="
      background: white;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      text-align: center;
      max-width: 400px;
      width: 90%;
    ">
      <h2 style="
        font-size: 1.5rem;
        color: #1F2937;
        margin-bottom: 0.5rem;
      ">カオナビ 採用記事レコメンダー</h2>
      <p style="
        color: #6B7280;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      ">閲覧にはパスワードが必要です</p>
      <input type="password" id="password-input" placeholder="パスワードを入力" style="
        width: 100%;
        padding: 1rem;
        border: 2px solid #E5E7EB;
        border-radius: 8px;
        font-size: 1rem;
        margin-bottom: 1rem;
        outline: none;
        transition: border-color 0.3s;
      " onfocus="this.style.borderColor='#4F46E5'" onblur="this.style.borderColor='#E5E7EB'">
      <p id="error-message" style="
        color: #EF4444;
        font-size: 0.85rem;
        margin-bottom: 1rem;
        display: none;
      ">パスワードが正しくありません</p>
      <button onclick="verifyPassword()" style="
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(79,70,229,0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">ログイン</button>
    </div>
  </div>

  <script>
    const CORRECT_HASH = '9a2912c761cc82d250c3f99ed4659d977400d383c6aa5091ce1b889c7ee0faf2';

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    async function verifyPassword() {
      const input = document.getElementById('password-input').value;
      const hash = await sha256(input);

      if (hash === CORRECT_HASH) {
        document.getElementById('auth-screen').style.display = 'none';
        sessionStorage.setItem('authenticated', 'true');
      } else {
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('password-input').style.borderColor = '#EF4444';
      }
    }

    document.getElementById('password-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyPassword();
    });

    if (sessionStorage.getItem('authenticated') === 'true') {
      document.getElementById('auth-screen').style.display = 'none';
    }
  </script>

  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const JOB_OPTIONS = [
      { value: "", label: "選択してください" },
      { value: "エンジニア", label: "エンジニア" },
      { value: "セールス", label: "セールス" },
      { value: "カスタマーサクセス", label: "カスタマーサクセス" },
      { value: "マーケティング", label: "マーケティング" },
      { value: "PdM", label: "PdM（プロダクトマネージャー）" },
      { value: "コーポレート", label: "コーポレート（経営企画・管理部門）" },
      { value: "デザイナー", label: "デザイナー" }
    ];

    const EXPERIENCE_OPTIONS = [
      { value: "", label: "選択してください" },
      { value: "新卒・第二新卒", label: "新卒・第二新卒" },
      { value: "若手", label: "若手（3〜5年）" },
      { value: "中堅", label: "中堅（6〜15年）" },
      { value: "ベテラン", label: "ベテラン（15年以上）" },
      { value: "40代以上", label: "40代以上" }
    ];

    const VALUES_OPTIONS = [
      { value: "成長志向", label: "成長・スキルアップ" },
      { value: "裁量・自律", label: "裁量・自律" },
      { value: "ワークライフバランス", label: "ワークライフバランス" },
      { value: "技術挑戦", label: "技術挑戦・アウトプット" },
      { value: "カルチャー・人", label: "カルチャー・人の良さ" },
      { value: "社会貢献", label: "社会貢献・ミッション共感" }
    ];

    const WORKSTYLE_OPTIONS = [
      { value: "", label: "選択してください" },
      { value: "フルリモート可", label: "フルリモート重視" },
      { value: "出社積極派", label: "出社も積極的にしたい" },
      { value: "どちらでも可", label: "どちらでも可" }
    ];

    const CAREER_PATH_OPTIONS = [
      { value: "", label: "選択してください" },
      { value: "専門性深化", label: "専門性を深めたい" },
      { value: "マネジメント挑戦", label: "マネジメントに挑戦したい" },
      { value: "幅広い経験", label: "幅広い経験を積みたい" },
      { value: "未定", label: "まだ決めていない" }
    ];

    const BACKGROUND_OPTIONS = [
      { value: "", label: "特になし" },
      { value: "大手出身", label: "大手企業出身" },
      { value: "スタートアップ出身", label: "スタートアップ・ベンチャー出身" },
      { value: "異業種転職", label: "異業種からの転職" },
      { value: "異職種転職", label: "異職種からの転職" }
    ];

    // ========================================
    // Phase 1: 改善版スコアロジック
    // ========================================

    // 関連職種マップ（部分マッチング用）
    const JOB_RELATIONS = {
      'エンジニア': ['PdM', 'デザイナー'],
      'PdM': ['エンジニア', 'デザイナー', 'マーケティング'],
      'セールス': ['カスタマーサクセス', 'マーケティング'],
      'カスタマーサクセス': ['セールス'],
      'マーケティング': ['セールス', 'PdM'],
      'デザイナー': ['PdM', 'エンジニア'],
      'コーポレート': []
    };

    // 経験年数のミスマッチ定義
    const EXPERIENCE_MISMATCH = {
      '新卒・第二新卒': ['40代以上', 'ベテラン'],
      '若手': ['40代以上'],
      '40代以上': ['新卒・第二新卒'],
      'ベテラン': ['新卒・第二新卒']
    };

    // A. 職種スコア（関連職種も考慮）
    const getJobScore = (article, candidateJob) => {
      if (!candidateJob) return { score: 0, isExactMatch: false };
      
      // 完全一致
      if (article.tags.job.includes(candidateJob)) {
        return { score: 5, isExactMatch: true };
      }
      
      // 関連職種マッチ
      const relatedJobs = JOB_RELATIONS[candidateJob] || [];
      if (article.tags.job.some(j => relatedJobs.includes(j))) {
        return { score: 2, isExactMatch: false };
      }
      
      return { score: 0, isExactMatch: false };
    };

    // B. 専門性ボーナス（職種が絞られた記事を優遇）
    const getSpecialtyBonus = (article, hasJobMatch) => {
      if (!hasJobMatch) return 0;
      
      const jobCount = article.tags.job.length;
      
      // 1職種のみ → 専門記事 → ボーナス大
      if (jobCount === 1) return 3;
      // 2-3職種 → やや専門 → ボーナス小
      if (jobCount <= 3) return 1;
      // 4職種以上 → 全社向け → ボーナスなし
      return 0;
    };

    // C. 組み合わせボーナス
    const getCombinationBonus = (matches) => {
      let bonus = 0;
      
      // 職種 + 経験 両方一致 → +2
      if (matches.job && matches.experience) {
        bonus += 2;
      }
      
      // 職種 + 経験 + 価値観1つ以上 → さらに +2
      if (matches.job && matches.experience && matches.valuesCount >= 1) {
        bonus += 2;
      }
      
      // 価値観が2つ以上一致 → 相乗効果 +1
      if (matches.valuesCount >= 2) {
        bonus += 1;
      }
      
      // 4項目以上一致 → 「完璧マッチ」ボーナス +3
      const totalMatches = [
        matches.job,
        matches.experience,
        matches.valuesCount > 0,
        matches.workstyle,
        matches.careerPath,
        matches.background
      ].filter(Boolean).length;
      
      if (totalMatches >= 4) {
        bonus += 3;
      }
      
      return bonus;
    };

    // D. ミスマッチ減点
    const getMismatchPenalty = (article, criteria) => {
      let penalty = 0;
      
      // 経験年数のミスマッチ
      if (criteria.experience && EXPERIENCE_MISMATCH[criteria.experience]) {
        const badMatches = EXPERIENCE_MISMATCH[criteria.experience];
        const articleExps = article.tags.experience;
        
        // 記事が「ミスマッチ経験層のみ」を対象としている場合
        const hasBadMatch = articleExps.some(e => badMatches.includes(e));
        const hasGoodMatch = articleExps.some(e => !badMatches.includes(e));
        
        if (hasBadMatch && !hasGoodMatch) {
          penalty -= 3;
        }
      }
      
      // キャリア志向の逆マッチ（専門性志向 vs マネジメント志向）
      if (criteria.careerPath === '専門性深化') {
        if (article.tags.careerPath.includes('マネジメント挑戦') &&
            !article.tags.careerPath.includes('専門性深化')) {
          penalty -= 1;
        }
      }
      if (criteria.careerPath === 'マネジメント挑戦') {
        if (article.tags.careerPath.includes('専門性深化') &&
            !article.tags.careerPath.includes('マネジメント挑戦')) {
          penalty -= 1;
        }
      }
      
      return penalty;
    };

    // 統合スコア計算（Phase 1 改善版）
    const calculateScore = (article, criteria) => {
      let score = 0;
      const matches = {
        job: false,
        experience: false,
        valuesCount: 0,
        workstyle: false,
        careerPath: false,
        background: false
      };
      const breakdown = [];
      
      // 1. 職種スコア（関連職種も考慮）
      const jobResult = getJobScore(article, criteria.job);
      score += jobResult.score;
      matches.job = jobResult.isExactMatch;
      if (jobResult.score > 0) {
        breakdown.push(jobResult.isExactMatch ? '職種一致' : '関連職種');
      }
      
      // 2. 経験年数
      if (criteria.experience && article.tags.experience.includes(criteria.experience)) {
        score += 3;
        matches.experience = true;
        breakdown.push('経験一致');
      }
      
      // 3. 価値観（複数選択可）
      if (criteria.values && criteria.values.length > 0) {
        const matchedValues = criteria.values.filter(v => 
          article.tags.values.includes(v)
        );
        score += matchedValues.length * 2;
        matches.valuesCount = matchedValues.length;
        if (matchedValues.length > 0) {
          breakdown.push(`価値観${matchedValues.length}件`);
        }
      }
      
      // 4. 働き方
      if (criteria.workstyle && article.tags.workstyle.includes(criteria.workstyle)) {
        score += 2;
        matches.workstyle = true;
        breakdown.push('働き方一致');
      }
      
      // 5. キャリア志向
      if (criteria.careerPath && article.tags.careerPath.includes(criteria.careerPath)) {
        score += 2;
        matches.careerPath = true;
        breakdown.push('キャリア一致');
      }
      
      // 6. 前職の特徴
      if (criteria.background && article.tags.background.includes(criteria.background)) {
        score += 1;
        matches.background = true;
        breakdown.push('前職一致');
      }
      
      // 7. 専門性ボーナス
      const specialtyBonus = getSpecialtyBonus(article, matches.job);
      if (specialtyBonus > 0) {
        score += specialtyBonus;
        breakdown.push(`専門性+${specialtyBonus}`);
      }
      
      // 8. 組み合わせボーナス
      const comboBonus = getCombinationBonus(matches);
      if (comboBonus > 0) {
        score += comboBonus;
        breakdown.push(`組合せ+${comboBonus}`);
      }
      
      // 9. ミスマッチ減点
      const penalty = getMismatchPenalty(article, criteria);
      if (penalty < 0) {
        score += penalty;
        breakdown.push(`調整${penalty}`);
      }
      
      // 50点満点に正規化（最大39点 → 50点）
      const rawScore = Math.max(0, score);
      const maxScore = 39;
      const normalizedScore = Math.round(rawScore / maxScore * 50);
      const matchPercent = Math.round(rawScore / maxScore * 100);
      
      return {
        score: rawScore,
        score50: Math.min(50, normalizedScore),
        matchPercent: Math.min(100, matchPercent),
        breakdown: breakdown
      };
    };

    const getRecommendations = (articles, criteria, topN = 5) => {
      return articles
        .map(a => {
          const result = calculateScore(a, criteria);
          return { ...a, score: result.score, score50: result.score50, matchPercent: result.matchPercent, breakdown: result.breakdown };
        })
        .filter(a => a.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, topN);
    };

    function App() {
      const [articles, setArticles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [criteria, setCriteria] = useState({ job: "", experience: "", values: [], workstyle: "", careerPath: "", background: "" });
      const [recommendations, setRecommendations] = useState([]);
      const [hasSearched, setHasSearched] = useState(false);

      useEffect(() => {
        fetch('./articles.json')
          .then(response => {
            if (!response.ok) throw new Error('データの読み込みに失敗しました');
            return response.json();
          })
          .then(data => {
            setArticles(data);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const handleValueChange = (value) => {
        setCriteria(prev => ({
          ...prev,
          values: prev.values.includes(value) ? prev.values.filter(v => v !== value) : [...prev.values, value]
        }));
      };

      const handleSearch = () => {
        setRecommendations(getRecommendations(articles, criteria));
        setHasSearched(true);
      };

      const handleClear = () => {
        setCriteria({ job: "", experience: "", values: [], workstyle: "", careerPath: "", background: "" });
        setRecommendations([]);
        setHasSearched(false);
      };

      const isFormValid = criteria.job || criteria.experience || criteria.values.length > 0;

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl mb-4">📚</div>
              <p className="text-gray-600">データを読み込み中...</p>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl mb-4">⚠️</div>
              <p className="text-red-600">{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 p-4">
          <div className="max-w-2xl mx-auto">
            <div className="text-center mb-6">
              <h1 className="text-2xl font-bold text-gray-800 mb-2">📚 カオナビ 採用記事レコメンダー</h1>
              <p className="text-gray-600 text-sm">候補者の特性に合わせて、最適な採用記事をおすすめします</p>
            </div>

            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
              <div className="mb-6">
                <h2 className="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                  <span className="bg-orange-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">1</span>
                  基本情報
                </h2>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">希望職種</label>
                    <select value={criteria.job} onChange={(e) => setCriteria({ ...criteria, job: e.target.value })}
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-300 focus:border-orange-400 outline-none">
                      {JOB_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">経験年数</label>
                    <select value={criteria.experience} onChange={(e) => setCriteria({ ...criteria, experience: e.target.value })}
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-300 focus:border-orange-400 outline-none">
                      {EXPERIENCE_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div className="mb-6">
                <h2 className="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                  <span className="bg-orange-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">2</span>
                  候補者が重視していること（複数選択可）
                </h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {VALUES_OPTIONS.map(opt => (
                    <label key={opt.value}
                      className={`flex items-center p-2 rounded-lg border cursor-pointer transition-all text-sm ${
                        criteria.values.includes(opt.value) ? 'bg-orange-100 border-orange-400 text-orange-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'
                      }`}>
                      <input type="checkbox" checked={criteria.values.includes(opt.value)} onChange={() => handleValueChange(opt.value)} className="sr-only" />
                      <span className={`w-4 h-4 rounded border mr-2 flex items-center justify-center flex-shrink-0 ${criteria.values.includes(opt.value) ? 'bg-orange-500 border-orange-500' : 'border-gray-300'}`}>
                        {criteria.values.includes(opt.value) && <svg className="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>}
                      </span>
                      {opt.label}
                    </label>
                  ))}
                </div>
                <p className="text-xs text-gray-400 mt-2">※1つのみを選択することを推奨します</p>
              </div>

              <div className="mb-6">
                <h2 className="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                  <span className="bg-orange-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">3</span>
                  働き方・キャリアの希望
                </h2>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">働き方の希望</label>
                    <select value={criteria.workstyle} onChange={(e) => setCriteria({ ...criteria, workstyle: e.target.value })}
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-300 focus:border-orange-400 outline-none">
                      {WORKSTYLE_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">キャリア志向</label>
                    <select value={criteria.careerPath} onChange={(e) => setCriteria({ ...criteria, careerPath: e.target.value })}
                      className="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-300 focus:border-orange-400 outline-none">
                      {CAREER_PATH_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div className="mb-6">
                <h2 className="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                  <span className="bg-orange-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">4</span>
                  前職の特徴（任意）
                </h2>
                <select value={criteria.background} onChange={(e) => setCriteria({ ...criteria, background: e.target.value })}
                  className="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-300 focus:border-orange-400 outline-none">
                  {BACKGROUND_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                </select>
              </div>

              <div className="flex gap-3">
                <button onClick={handleSearch} disabled={!isFormValid}
                  className={`flex-1 py-3 rounded-lg font-semibold transition-all ${isFormValid ? 'bg-orange-500 text-white hover:bg-orange-600 shadow-md hover:shadow-lg' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                  🔍 おすすめ記事を探す
                </button>
                <button onClick={handleClear} className="px-4 py-3 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-all">クリア</button>
              </div>
            </div>

            {hasSearched && (
              <div className="bg-white rounded-xl shadow-lg p-6">
                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                  ✨ おすすめ記事
                  {recommendations.length > 0 && <span className="ml-2 text-sm font-normal text-gray-500">（{recommendations.length}件）</span>}
                </h2>
                {recommendations.length === 0 ? (
                  <div className="text-center py-8 text-gray-500">
                    <p className="text-4xl mb-2">🤔</p>
                    <p>条件に合う記事が見つかりませんでした</p>
                    <p className="text-sm mt-1">条件を変更してお試しください</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {recommendations.map((article, index) => (
                      <div key={article.id} className="border border-gray-200 rounded-lg p-4 hover:border-orange-300 hover:shadow-md transition-all">
                        <div className="flex items-start gap-3">
                          <div className="flex-shrink-0 w-8 h-8 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold text-sm">{index + 1}</div>
                          <div className="flex-1 min-w-0">
                            <h3 className="font-semibold text-gray-800 text-sm leading-tight mb-2">{article.title}</h3>
                            <p className="text-xs text-gray-500 mb-2">
                              <span className="inline-block bg-gray-100 px-2 py-0.5 rounded mr-2">{article.media}</span>
                              <span className="text-orange-600 font-semibold">{article.score50}点/50点（マッチ度{article.matchPercent}%）</span>
                            </p>
                            {/* スコア内訳を表示 */}
                            <div className="flex flex-wrap gap-1 mb-2">
                              {article.breakdown.map((item, i) => (
                                <span key={i} className="inline-block bg-orange-50 text-orange-700 text-xs px-2 py-0.5 rounded">
                                  {item}
                                </span>
                              ))}
                            </div>
                            <div className="bg-amber-50 rounded-lg p-2 mb-3">
                              <p className="text-xs text-amber-800">💡 {article.reasonTemplate}</p>
                            </div>
                            <a href={article.url} target="_blank" rel="noopener noreferrer"
                              className="inline-flex items-center text-sm text-orange-600 hover:text-orange-700 font-medium">
                              🔗 記事を読む
                              <svg className="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                              </svg>
                            </a>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="text-center mt-6 text-xs text-gray-400">
              v2.2（50点満点表示対応）| 記事データ: {articles.length}件 | For カオナビ採用担当者様
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
